# Гашение монитора, пока активен hyprlock.
# hyprlock сам экран не выключает — это делает hypridle через DPMS.
#
# timeout = секунды простоя после последней мыши/клавиши.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Простой без блокировки: погасить монитор.
# Видео и caffeine держат inhibit — экран при этом не гаснет.
# timeout = секунды с последней мыши или клавиши.
listener {
    timeout = 60
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Если сессия уже заблокирована и ничего не происходит — погасить монитор.
# ignore_inhibit: не держать подсветку из‑за видео/caffeine, пока экран заперт.
listener {
    timeout = 60
    ignore_inhibit = true
    on-timeout = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
